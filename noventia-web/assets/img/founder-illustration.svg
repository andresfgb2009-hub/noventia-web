        fill="#151220" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- shirt collar -->
  <path d="M 726,388 L 760,432 L 794,388 L 780,378 L 760,396 L 740,378 Z" fill="#F5F4FA"/>

  <!-- tie -->
  <path d="M 750,396 L 770,396 L 778,422 L 760,452 L 742,422 Z" fill="url(#tieGrad)"/>
  <path d="M 748,420 L 772,420 L 782,540 L 760,572 L 738,540 Z" fill="url(#tieGrad)"/>

  <!-- lapels -->
