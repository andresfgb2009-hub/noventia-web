<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <defs>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="1400" fill="#0A0A18"/>
  <ellipse cx="780" cy="260" rx="420" ry="420" fill="url(#glowIndigo)"/>
  <ellipse cx="180" cy="160" rx="320" ry="320" fill="url(#glowMagenta)"/>
  <ellipse cx="560" cy="1330" rx="460" ry="460" fill="url(#glowCyan)"/>

  <ellipse cx="760" cy="1290" rx="150" ry="26" fill="url(#groundShadow)"/>

  <!-- legs -->
  <path d="M 666,660 L 676,1260 L 735,1260 L 755,660 Z" fill="#100E19" stroke="url(#rimGrad)" stroke-width="1.5"/>
  <path d="M 854,660 L 844,1260 L 785,1260 L 765,660 Z" fill="#100E19" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- shoes -->
  <path d="M 674,1260 C 668,1252 682,1244 705,1244 C 730,1244 742,1252 740,1262 C 738,1270 726,1274 703,1274 C 682,1274 674,1268 674,1260 Z" fill="#0A0912"/>
  <path d="M 786,1262 C 784,1252 796,1244 821,1244 C 844,1244 858,1252 852,1260 C 848,1268 836,1274 815,1274 C 792,1274 786,1270 786,1262 Z" fill="#0A0912"/>

  <!-- arms -->
  <path d="M 606,412 C 580,455 566,530 570,600 C 572,625 578,642 586,652 L 628,644 C 620,600 616,540 620,495 C 622,455 630,425 646,400 Z" fill="#13111E" stroke="url(#rimGrad)" stroke-width="1.5"/>
  <path d="M 914,412 C 940,455 954,530 950,600 C 948,625 942,642 934,652 L 892,644 C 900,600 904,540 900,495 C 898,455 890,425 874,400 Z" fill="#13111E" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- cuffs -->
  <rect x="572" y="638" width="30" height="12" rx="4" fill="#F5F4FA"/>
  <rect x="918" y="638" width="30" height="12" rx="4" fill="#F5F4FA"/>

  <!-- hands -->
  <ellipse cx="584" cy="660" rx="19" ry="23" fill="#C89B72"/>
  <ellipse cx="936" cy="660" rx="19" ry="23" fill="#C89B72"/>

  <!-- torso / jacket -->
  <path d="M 640,398
           C 655,382 700,376 760,376
           C 820,376 865,382 880,398
           C 900,418 912,450 914,490
           C 918,560 912,620 902,660
           C 860,676 660,676 618,660
           C 608,620 602,560 606,490
