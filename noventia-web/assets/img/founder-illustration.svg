  <path d="M 794,392 L 760,432 L 824,458 L 852,398 Z" fill="#1C1929" opacity="0.9"/>

  <!-- neck -->
  <rect x="726" y="326" width="68" height="60" rx="14" fill="#C89B72"/>

  <!-- head -->
  <ellipse cx="760" cy="252" rx="86" ry="94" fill="#CFA279"/>

  <!-- ears -->
  <ellipse cx="672" cy="258" rx="14" ry="20" fill="#CFA279"/>
  <ellipse cx="848" cy="258" rx="14" ry="20" fill="#CFA279"/>

  <!-- simple facial features -->
  <ellipse cx="726" cy="256" rx="7" ry="9" fill="#171426"/>
  <ellipse cx="794" cy="256" rx="7" ry="9" fill="#171426"/>
  <path d="M 720,300 C 736,316 784,316 800,300" fill="none" stroke="#171426" stroke-width="4" stroke-linecap="round"/>

  <!-- hair -->
  <path d="M 664,240
           C 656,180 690,124 760,120
           C 832,116 876,158 882,214
           C 886,244 878,266 862,276
           C 866,254 856,232 838,238
           C 848,254 840,272 822,266
           C 830,248 814,232 800,240
           C 808,256 796,268 780,258
           C 786,242 770,232 756,242
           C 762,258 748,266 734,254
           C 712,272 684,270 670,260
           C 658,254 660,246 664,240 Z"
        fill="#12101B"/>
  <path d="M 664,240 C 656,180 690,124 760,120 C 780,119 798,122 813,129 C 780,116 736,124 706,158 C 682,186 672,214 674,244 C 671,244 667,242 664,240 Z" fill="#171526"/>
